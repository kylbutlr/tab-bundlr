name: Extension checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: extension-candidate
          path: |
            dist/*.zip
            dist/*.sha256
            dist/qa-*/
          retention-days: 14
